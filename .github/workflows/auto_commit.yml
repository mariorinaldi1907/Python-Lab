name: 🐍 Auto Python Project Generator

on:
  schedule:
    # 6 time slots spread across the day (UTC).
    # The Python script randomly skips ~30% of these → looks like natural dev activity.
    # Adjust times to match YOUR timezone if you want commits during your waking hours.
    # Current slots ≈ SGT (UTC+8): 9am, 12pm, 3pm, 7pm, 10pm, 1am
    - cron: '0 1 * * *'     # 9:00 AM SGT
    - cron: '0 4 * * *'     # 12:00 PM SGT
    - cron: '0 7 * * *'     # 3:00 PM SGT
    - cron: '30 10 * * *'   # 6:30 PM SGT
    - cron: '0 14 * * *'    # 10:00 PM SGT
    - cron: '30 17 * * *'   # 1:30 AM SGT

  # Lets you manually trigger a run from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      force_commit:
        description: 'Force a commit even if random roll fails'
        required: false
        default: 'false'
        type: boolean

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    # Required so the workflow can push commits back to the repo
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install anthropic

      - name: 🤖 Generate Python project(s)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_COMMIT: ${{ github.event.inputs.force_commit }}
        run: python generate_project.py

      - name: 📝 Commit and push (if anything was generated)
        run: |
          # Exit cleanly if no commit message was written (random skip)
          if [ ! -s .commit_message ]; then
            echo "No commit this run (random skip or no output). Exiting cleanly."
            exit 0
          fi

          git config --local user.email "${{ secrets.GIT_EMAIL }}"
          git config --local user.name "mariorinaldi1907"

          git add -A

          # Only commit if there are actual staged changes
          if git diff --staged --quiet; then
            echo "No file changes to commit."
            exit 0
          fi

          git commit -F .commit_message
          git push

          echo "✅ Committed and pushed successfully!"
